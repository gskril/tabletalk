<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fffaf2" />
    <title>You’re offline · Tabletalk</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #fffaf2;
        color: #302626;
        font:
          17px/1.6 system-ui,
          sans-serif;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
      }
      main {
        max-width: 380px;
      }
      .brand {
        font:
          italic 32px Georgia,
          serif;
        color: #7d2939;
      }
      h1 {
        font:
          40px/1.1 Georgia,
          serif;
      }
      p {
        color: #625550;
      }
      button {
        border: 0;
        background: #7d2939;
        color: #fffaf2;
        padding: 14px 22px;
        border-radius: 8px;
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #7d2939;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">tabletalk</div>
      <h1>Your table will be here.</h1>
      <p>
        You’re offline. Connect to the internet to browse restaurants, see your
        friends’ finds, and save your next spot.
      </p>
      <button onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
